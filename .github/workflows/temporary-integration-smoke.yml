name: Temporary integration smoke test
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify migrated production integrations
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2"
            local code
            code=$(curl -L -sS --retry 8 --retry-delay 4 --retry-all-errors --connect-timeout 30 --max-time 240 -o "$out" -w "%{http_code}" "$url")
            echo "$url STATUS=$code BYTES=$(wc -c < "$out")"
            test "$code" -ge 200
            test "$code" -lt 400
          }

          fetch "https://yousef-portfolio-63jd.onrender.com/" /tmp/portfolio.html
          fetch "https://arabic-search-context-lab-prod.onrender.com/proof" /tmp/serpapi.html
          fetch "https://iqd-market-tracker-g192.onrender.com/" /tmp/iqd.html
          fetch "https://seen-it-zae7.onrender.com/" /tmp/seen.html
          fetch "https://multilingual-cms-prod.onrender.com/" /tmp/cms.html

          fetch "https://seen-it-zae7.onrender.com/api/onboarding" /tmp/onboarding.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/onboarding.json"))
          n=len(data.get("titles",[]))
          print("SEEN_IT_ONBOARDING_TITLES",n)
          assert n>0
          PY

          search_code=$(curl -L -sS --retry 5 --retry-all-errors --max-time 240 \
            -H 'content-type: application/json' \
            -d '{"query":"Dune","limit":5}' \
            -o /tmp/search.json -w "%{http_code}" \
            "https://seen-it-zae7.onrender.com/api/search")
          echo "SEEN_IT_SEARCH_STATUS=$search_code"
          test "$search_code" = "200"
          python - <<'PY'
          import json
          data=json.load(open("/tmp/search.json"))
          n=len(data.get("titles",[]))
          print("SEEN_IT_SEARCH_TITLES",n)
          assert n>0
          PY

          cms_code=$(curl -L -sS --retry 5 --retry-all-errors --max-time 180 \
            -o /tmp/posts.json -w "%{http_code}" \
            "https://multilingual-cms-prod.onrender.com/api/posts?published=true")
          echo "CMS_POSTS_STATUS=$cms_code"
          test "$cms_code" = "200"
          python - <<'PY'
          import json
          data=json.load(open("/tmp/posts.json"))
          print("CMS_POSTS_TYPE",type(data).__name__,"COUNT",len(data))
          assert isinstance(data,list)
          PY

          auth_code=$(curl -L -sS --retry 3 --retry-all-errors --max-time 120 \
            -o /tmp/me.json -w "%{http_code}" \
            "https://multilingual-cms-prod.onrender.com/api/me")
          echo "CMS_AUTH_GUARD_STATUS=$auth_code"
          test "$auth_code" = "401"

          base="https://seen-it-zae7.onrender.com"
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/seen.html | sed -E 's/^src="//;s/"$//' | sort -u > /tmp/scripts.txt || true
          : > /tmp/alljs.txt
          while IFS= read -r src; do
            case "$src" in
              http*) url="$src" ;;
              /*) url="$base$src" ;;
              *) url="$base/$src" ;;
            esac
            curl -L -sS --retry 3 --retry-all-errors --max-time 120 "$url" >> /tmp/alljs.txt || true
            printf '\n' >> /tmp/alljs.txt
          done < /tmp/scripts.txt
          grep -q 'kieglzaewzqogevgraks.supabase.co/storage/v1/object/public/seen-it-data' /tmp/alljs.txt
          if grep -q 'hdwfbshqjksqcexetfgy.supabase.co/storage/v1/object/public/seen-it-data' /tmp/alljs.txt; then
            echo "OLD_SEEN_IT_DATA_SOURCE_STILL_PRESENT"
            exit 1
          fi
          echo "SEEN_IT_DATA_SOURCE_CUTOVER_OK"
