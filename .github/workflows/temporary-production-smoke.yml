name: Temporary production smoke test
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed sites
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://yousef-portfolio-63jd.onrender.com/"
            "https://arabic-search-context-lab-prod.onrender.com/"
            "https://arabic-search-context-lab-prod.onrender.com/proof"
            "https://iqd-market-tracker-g192.onrender.com/"
            "https://seen-it-zae7.onrender.com/"
            "https://multilingual-cms-prod.onrender.com/"
          )
          for url in "${urls[@]}"; do
            echo "CHECK $url"
            code=$(curl -L -sS --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 180 -o /tmp/body.txt -w "%{http_code}" "$url")
            echo "STATUS $code"
            test "$code" -ge 200
            test "$code" -lt 400
            test -s /tmp/body.txt
          done
